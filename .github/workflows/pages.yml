name: presentation
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier la CI canonique réussie du commit exact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_release_ci.py --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
  pages:
    needs: [checks]
    # Aucune publication avant validation commune et activation explicite.
    if: vars.PUBLICATION_APPROVED == 'true'
    environment: publication-approved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôle de publication de la source et de son historique
        run: python scripts/check_publication.py --history-ref HEAD
      - name: Installer Gitleaks épinglé et vérifier son archive
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar --extract --gzip --file "$archive" --directory "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          printf '%s\n' "${RUNNER_TEMP}/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Construire les pages et leurs liens documentaires
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python scripts/build_site.py --repository-url "$REPOSITORY_URL" --output _site
      - name: Scanner la sortie Pages avant téléversement
        run: gitleaks dir _site --config .gitleaks.toml --redact --no-banner
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
