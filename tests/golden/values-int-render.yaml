# Source: quadringent/templates/fleet-observe-cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cdc-quadringent-fleet-observe
  namespace: quadringent-demo
  labels:
    app.kubernetes.io/name: quadringent
    app.kubernetes.io/instance: cdc
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.2.3"
spec:
  schedule: "*/4 * * * *"
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/component: fleet-observability
        spec:
          serviceAccountName: cdcforge-verifier
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          imagePullSecrets:
            - name: quadringent-registry
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: observer
              image: "ghcr.io/quadringent/quadringent@sha256:916e91ab71c973ba255a7c78cb40668a6344dffc43e9e18eca854789dab6b730"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # Mesure la livraison Snowflake des voies déclarées et
                  # publie la preuve combinée sur la clé dédiée
                  # fleet/console-proof.json — le snapshot du lecteur n'est
                  # jamais modifié (une clé, un écrivain).
                  python /app/scripts/quadringent_fleet_observe.py \
                    --aws-default-credentials \
                    --snowflake-oidc-token-file /var/run/secrets/snowflake/token \
                    --manifest-budget 1500 \
                    --execute
              envFrom:
                - configMapRef:
                    name: cdc-quadringent-site
              env:
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_DEFAULT_REGION
                  value: "eu-west-3"
                - name: AWS_STS_REGIONAL_ENDPOINTS
                  value: regional
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 192Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: snowflake-identity
                  mountPath: /var/run/secrets/snowflake
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: snowflake-identity
              projected:
                defaultMode: 0440
                sources:
                  - serviceAccountToken:
                      audience: snowflakecomputing.com
                      expirationSeconds: 600
                      path: token
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
---
# Source: quadringent/templates/observability-cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cdc-quadringent-observe
  namespace: quadringent-demo
  labels:
    app.kubernetes.io/name: quadringent
    app.kubernetes.io/instance: cdc
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.2.3"
spec:
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/component: observability
        spec:
          serviceAccountName: cdcforge-verifier
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          imagePullSecrets:
            - name: quadringent-registry
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: observer
              image: "ghcr.io/quadringent/quadringent@sha256:916e91ab71c973ba255a7c78cb40668a6344dffc43e9e18eca854789dab6b730"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  python /app/scripts/quadringent_observability_refresh.py \
                    --policy /etc/quadringent-slo/policy.json \
                    --out /work/observation.json \
                    --aws-default-credentials \
                    --snowflake-oidc-token-file /var/run/secrets/snowflake/token \
                    --publish-confirm "REFRESH_AS400_RD_OBSERVABILITY_DEV"
                  # Le rapport SLO est le bloc slo_report de la preuve combinée :
                  # une observation sans rapport refuse de continuer.
                  python -c 'import json, sys
                  document = json.load(open("/work/observation.json"))
                  report = document.get("observability", {}).get("slo_report")
                  if not isinstance(report, dict):
                      sys.exit("observation without an SLO report")
                  open("/work/slo-report.json", "w").write(json.dumps(report))'
                  if [ -n "${QUADRINGENT_ALERT_WEBHOOK_URL:-}${QUADRINGENT_ALERT_SNS_TOPIC:-}" ]; then
                    python /app/scripts/quadringent_slo_alerts.py \
                      --report /work/slo-report.json \
                      --state /work/slo-alert-state.json \
                      --observability-snapshot /work/observation.json
                  else
                    # Sans destination déclarée, la réconciliation reste
                    # silencieuse : le CronJob n'échoue jamais sur l'état
                    # d'alerte, et le code de sortie ne propage rien.
                    python /app/scripts/quadringent_slo_alerts.py \
                      --report /work/slo-report.json \
                      --state /work/slo-alert-state.json \
                      --observability-snapshot /work/observation.json || true
                  fi
              envFrom:
                - configMapRef:
                    name: cdc-quadringent-site
              env:
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_DEFAULT_REGION
                  value: "eu-west-3"
                - name: AWS_STS_REGIONAL_ENDPOINTS
                  value: regional
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 192Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: policy
                  mountPath: /etc/quadringent-slo
                  readOnly: true
                - name: snowflake-identity
                  mountPath: /var/run/secrets/snowflake
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: policy
              configMap:
                name: cdc-quadringent-observe
                defaultMode: 0444
            - name: snowflake-identity
              projected:
                defaultMode: 0440
                sources:
                  - serviceAccountToken:
                      audience: snowflakecomputing.com
                      expirationSeconds: 600
                      path: token
            - name: work
              emptyDir:
                sizeLimit: 16Mi
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
