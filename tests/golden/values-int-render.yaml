# Source: quadringent/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-quadringent
  annotations:
    quadringent.io/environment: dev
    quadringent.io/production-promotion: forbidden
  labels:
    app.kubernetes.io/name: quadringent
    app.kubernetes.io/instance: cdc
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.2.3"
spec:
  replicas: 0
  strategy:
    type: Recreate          # jamais deux lecteurs en même temps, même le temps d'un rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: quadringent
      app.kubernetes.io/instance: cdc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quadringent
        app.kubernetes.io/instance: cdc
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.2.3"
    spec:
      serviceAccountName: as400-snowflake-capture
      imagePullSecrets:
        - name: quadringent-registry
      nodeSelector:
        workload: popsink
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: popsink
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  ppsk/strategy: ibmi-to-kafka
              namespaces:
                - popsink
              topologyKey: kubernetes.io/hostname
      volumes:
        - name: ibmi-ca
          secret:
            secretName: "quadringent-ibmi-ca"
            items:
              - key: "ca.crt"
                path: "ibmi-ca.pem"
      containers:
        - name: capture
          image: ghcr.io/quadringent/quadringent@sha256:22089a7e7c78f026e396258da8b7dc0be3e6421a79066998c4e1df3a5e4d7190
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-interval-seconds
            - "60"
            - --max-consecutive-errors
            - "3"
            - --console-snapshot-interval-seconds
            - "10"
          envFrom:
            - configMapRef:
                name: cdc-quadringent-tuning
            - configMapRef:
                name: cdc-quadringent-site
          env:
            - name: ISERIES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: example-corp-ibmi
                  key: ISERIES_PASSWORD
          volumeMounts:
            - name: ibmi-ca
              mountPath: "/app/certs"
              readOnly: true
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 50m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            # Docker USER porte un nom ; kubelet exige un UID explicite pour
            # certifier runAsNonRoot avant même de démarrer le conteneur.
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          # Le lecteur n'expose aucun endpoint et n'écrit aucun heartbeat local :
          # le snapshot console part en S3. La readiness vérifie donc que le
          # processus python de capture et son worker JVM vivent — la sonde
          # exclut son propre pid pour ne pas s'attester elle-même ; la
          # liveness mesure la progression CPU du worker JVM dans /proc — une
          # JVM gelée n'y consomme plus rien et finit par dépasser le seuil
          # interne de 240 s, là où un pgrep verrait encore un processus
          # « vivant ».
          readinessProbe:
            exec:
              command:
                - /opt/venv/bin/python
                - -S
                - -c
                - |
                  import glob, os, sys
                  self_pid = os.getpid()
                  worker = jvm = False
                  for path in glob.glob("/proc/[0-9]*/comm"):
                      pid = int(path.split("/")[2])
                      if pid == self_pid:
                          continue
                      try:
                          with open(path) as handle:
                              comm = handle.read().strip()
                      except OSError:
                          continue
                      if comm == "java":
                          jvm = True
                      elif comm.startswith("python"):
                          # Seul le lecteur python atteste la readiness : un
                          # autre probe concurrent ne doit pas se prendre
                          # pour le worker.
                          try:
                              with open("/proc/%d/cmdline" % pid, "rb") as handle:
                                  cmdline = handle.read()
                          except OSError:
                              continue
                          if b"as400_continuous_capture" in cmdline:
                              worker = True
                  sys.exit(0 if worker and jvm else 1)
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /opt/venv/bin/python
                - -S
                - -c
                - |
                  import glob, json, os, sys, time
                  STALE_SECONDS = 240.0
                  STATE = "/tmp/quadringent-capture-live.json"
                  self_pid = os.getpid()
                  ticks = 0
                  for path in glob.glob("/proc/[0-9]*/stat"):
                      pid = int(path.split("/")[2])
                      if pid == self_pid:
                          continue
                      try:
                          with open(path) as handle:
                              raw = handle.read()
                          # Seul le worker JVM compte : la sonde elle-même et
                          # le lecteur python consomment des ticks sans jamais
                          # prouver que le lecteur JVM progresse.
                          comm = raw[raw.index("(") + 1:raw.rindex(")")]
                          if comm != "java":
                              continue
                          fields = raw.rsplit(")", 1)[-1].split()
                          ticks += int(fields[11]) + int(fields[12])
                      except (OSError, IndexError, ValueError):
                          continue
                  if ticks <= 0:
                      sys.exit(1)
                  now = time.time()
                  try:
                      with open(STATE) as handle:
                          previous = json.load(handle)
                  except (OSError, ValueError):
                      previous = {}
                  if previous.get("ticks") != ticks:
                      previous = {"ticks": ticks, "since": now}
                  elif now - float(previous.get("since", now)) > STALE_SECONDS:
                      sys.exit(1)
                  try:
                      with open(STATE, "w") as handle:
                          json.dump(previous, handle)
                  except OSError:
                      pass
                  sys.exit(0)
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
