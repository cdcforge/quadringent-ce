{{- /*
  ServiceAccount de capture : identité cloud des pods qui écrivent réellement
  dans le stockage brut du site (Deployment "capture" de deployment.yaml, et
  les Deployments/Jobs créés par l'exécuteur de pipeline v2 via
  QUADRINGENT_V2_CAPTURE_SERVICE_ACCOUNT — voir chart/templates/control-plane.yaml
  et src/quadringent_control_plane/v2/entrypoint.py::build_pipeline_executor).

  Avant ce fichier, serviceAccount.name désignait un ServiceAccount fourni
  hors de la chart (create=false) : en pratique jamais lié à une identité
  cloud par l'installateur (`quadringent install`), qui publiait
  serviceAccount: {create: false, name: "default"}. Les pods de capture
  tournaient donc sous le ServiceAccount `default` du namespace, sans aucun
  droit S3/GCS — seul controlPlane.serviceAccount était lié par IRSA/Workload
  Identity. create=true (défaut désormais) corrige ce défaut : la chart crée
  ce ServiceAccount et pose l'annotation d'identité cloud attendue par
  deploy/terraform/<cloud>/eks-addon|gke-addon, qui lie ce nom (en plus de
  controlPlane.serviceAccount.name) à l'identité runtime bornée produite par
  deploy/terraform/<cloud>/base.
*/ -}}
{{- if .Values.serviceAccount.create }}
{{- $storageBackend := .Values.storage.backend | default "aws" }}
{{ include "quadringent.siteGuards" . }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" (required "serviceAccount.name est obligatoire lorsque serviceAccount.create=true" .Values.serviceAccount.name)) }}
{{- fail "serviceAccount.name doit être un nom Kubernetes borné" }}
{{- end }}
{{- /* Même contrat mutuellement exclusif que controlPlane.serviceAccount :
  déclarer l'annotation du backend inactif est un refus explicite. */ -}}
{{- if eq $storageBackend "aws" }}
{{- if .Values.serviceAccount.gcpServiceAccount }}
{{- fail "serviceAccount.gcpServiceAccount ne s'applique qu'à storage.backend=gcs" }}
{{- end }}
{{- if not (regexMatch (printf "^arn:aws:iam::%s:role/[A-Za-z0-9+=,.@_/-]{1,128}$" .Values.site.awsAccountId) (required "serviceAccount.roleArn est obligatoire lorsque serviceAccount.create=true et storage.backend=aws" .Values.serviceAccount.roleArn)) }}
{{- fail "serviceAccount.roleArn doit rester une identité du compte déclaré" }}
{{- end }}
{{- else if eq $storageBackend "gcs" }}
{{- if .Values.serviceAccount.roleArn }}
{{- fail "serviceAccount.roleArn ne s'applique qu'à storage.backend=aws" }}
{{- end }}
{{- if not (regexMatch "^[a-zA-Z0-9-]{6,30}@[a-zA-Z0-9.-]{1,128}\\.iam\\.gserviceaccount\\.com$" (required "serviceAccount.gcpServiceAccount est obligatoire lorsque serviceAccount.create=true et storage.backend=gcs" .Values.serviceAccount.gcpServiceAccount)) }}
{{- fail "serviceAccount.gcpServiceAccount doit être une adresse de compte de service GCP valide" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  annotations:
    {{- if eq $storageBackend "aws" }}
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
    {{- else if and (eq $storageBackend "gcs") (eq .Values.gcpIdentityMode "gke-workload-identity") }}
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | quote }}
    {{- end }}
    quadringent.io/environment: {{ .Values.deployment.environment }}
    quadringent.io/production-promotion: forbidden
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "quadringent.labels" . | nindent 4 }}
    app.kubernetes.io/component: capture
{{- /* Les Deployments/Jobs créés par l'exécuteur v2 utilisent ce compte :
  l'admission Kubernetes leur transmet ces secrets de tirage. */}}
{{- $pullSecrets := .Values.imagePullSecrets | default list }}
{{- with .Values.image.pullSecret }}
{{- $pullSecrets = append $pullSecrets (dict "name" .) }}
{{- end }}
{{- with $pullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
