{{- /*
  Secrets applicatifs du control plane v2, générés une seule fois et
  conservés ensuite (helm.sh/resource-policy: keep + lookup — voir
  postgres.yaml pour le même mécanisme, déjà documenté en détail).

  - SECRET_KEY : clé Fernet (chiffrement des secrets de connexion en base,
    voir src/quadringent_control_plane/v2/crypto.py). Une rotation sans
    migration rendrait tout secret déjà chiffré indéchiffrable — jamais
    régénérée après le premier rendu.
  - TOKEN_PEPPER : pepper serveur des jetons d'agent, réutilisé pour signer
    les cookies de session (même module) — une rotation invaliderait tous
    les jetons et sessions actifs.
*/ -}}
{{- if .Values.controlPlane.v2.enabled }}
{{- $secretName := printf "%s-v2-secrets" (include "quadringent.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $secretKey := "" }}
{{- $tokenPepper := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "SECRET_KEY") (hasKey $existing.data "TOKEN_PEPPER") }}
{{- $secretKey = index $existing.data "SECRET_KEY" }}
{{- $tokenPepper = index $existing.data "TOKEN_PEPPER" }}
{{- else }}
{{- /* randBytes n rend directement une valeur utilisable comme clé Fernet
  (texte base64 standard de n octets aléatoires — cryptography.fernet.Fernet
  décode aussi bien l'alphabet standard que l'alphabet URL-safe, vérifié) ;
  b64enc l'encode ensuite une fois pour le stockage Secret.data. */ -}}
{{- $secretKey = randBytes 32 | b64enc }}
{{- $tokenPepper = randAlphaNum 43 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    helm.sh/resource-policy: keep
    quadringent.io/environment: {{ .Values.deployment.environment }}
    quadringent.io/production-promotion: forbidden
  labels:
    {{- include "quadringent.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
type: Opaque
data:
  SECRET_KEY: {{ $secretKey | quote }}
  TOKEN_PEPPER: {{ $tokenPepper | quote }}
{{- end }}
